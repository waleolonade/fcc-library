# =========================================================================
# Nginx Virtual Host Configuration for FCC Smart Library
# Frontend Domain: fccibadanlibrary.com.ng
# Backend API Domain: api.fccibadanlibrary.com.ng
# =========================================================================

# 1. Backend Laravel API (api.fccibadanlibrary.com.ng)
server {
    listen 80;
    listen [::]:80;
    server_name api.fccibadanlibrary.com.ng;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.fccibadanlibrary.com.ng;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.fccibadanlibrary.com.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.fccibadanlibrary.com.ng/privkey.pem;

    root /var/www/fcclibrary/backend/public;
    index index.php index.html;

    client_max_body_size 64M;

    # CORS & Security Headers
    add_header Access-Control-Allow-Origin "https://fccibadanlibrary.com.ng" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 2. Frontend React SPA (fccibadanlibrary.com.ng) — If hosted on VPS rather than Netlify
server {
    listen 80;
    listen [::]:80;
    server_name fccibadanlibrary.com.ng www.fccibadanlibrary.com.ng;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fccibadanlibrary.com.ng www.fccibadanlibrary.com.ng;

    # ssl_certificate /etc/letsencrypt/live/fccibadanlibrary.com.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fccibadanlibrary.com.ng/privkey.pem;

    root /var/www/fcclibrary/dist;
    index index.html;

    # Reverse proxy /api to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /student/ {
        try_files $uri $uri/ /student.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
