<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/fcc-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCC Smart Library & Digital Repository Platform</title>
    <meta name="description" content="Federal Co-operative College, Ibadan - Smart Integrated Library & Digital Repository Services Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <!-- Universal API & Asset Interceptor for XAMPP Apache, LAN and Vite -->
    <script type="text/javascript">
      (function() {
        var origFetch = window.fetch;
        window.fetch = function(url, options) {
          if (typeof url === 'string' && url.startsWith('/api')) {
            var path = window.location.pathname;
            if (path.indexOf('/fcclibrary') !== -1) {
              var root = path.substring(0, path.indexOf('/fcclibrary') + '/fcclibrary'.length);
              url = root + '/backend/public' + url;
            }
          }
          return origFetch(url, options);
        };

        // Automatic fallback for asset paths under XAMPP subfolders
        document.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG') {
            var src = e.target.getAttribute('src');
            if (src && (src.startsWith('/assets/') || src.startsWith('/fcc-logo.png') || src.indexOf('fcc-logo.png') !== -1)) {
              var path = window.location.pathname;
              if (path.indexOf('/fcclibrary') !== -1) {
                var root = path.substring(0, path.indexOf('/fcclibrary') + '/fcclibrary'.length);
                var filename = src.split('/').pop();
                var candidate = root + '/dist/assets/' + filename;
                if (e.target.src !== candidate) {
                  e.target.src = candidate;
                }
              }
            }
          }
        }, true);
      })();
    </script>
    <!-- Google Books Embedded Viewer Official API -->
    <script type="text/javascript" src="https://www.google.com/books/jsapi.js"></script>
    <script type="text/javascript">
      window.initGoogleBooksApi = function(cb) {
        if (window.google && window.google.books) {
          if (window.google.books.DefaultViewer) {
            if (cb) cb();
          } else {
            window.google.books.load();
            window.google.books.setOnLoadCallback(function() {
              if (cb) cb();
            });
          }
        }
      };
      try {
        if (window.google && window.google.books) {
          window.google.books.load();
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
