# =========================================================================
# Netlify Configuration for FCC Smart Library Platform
# Primary Production Domain: fccibadanlibrary.com.ng
# Backend API Endpoint: api.fccibadanlibrary.com.ng
# =========================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PUBLIC_APP_URL = "https://fccibadanlibrary.com.ng"
  VITE_API_BASE_URL = "/api"

# Reverse Proxy API requests to the live Laravel server
[[redirects]]
  from = "/api/*"
  to = "https://api.fccibadanlibrary.com.ng/api/:splat"
  status = 200
  force = true

# Redirect rules for Multi-Page SPA entry points
[[redirects]]
  from = "/student/*"
  to = "/student.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
