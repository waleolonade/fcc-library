<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/fcc-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCC Ibadan Student & Scholar Portal</title>
    <meta name="description" content="Federal Co-operative College, Ibadan - Standalone Student Digital Library & Scholar Portal" />
    <!-- Progressive Web App (PWA) Standards for all Operating Systems -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FCC Library" />
    <link rel="apple-touch-icon" href="/assets/fcc-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Universal API & Asset Interceptor for XAMPP Apache, LAN and Vite -->
    <script type="text/javascript">
      (function() {
        var origFetch = window.fetch;
        window.fetch = function(url, options) {
          if (typeof url === 'string' && url.startsWith('/api')) {
            var path = window.location.pathname;
            if (path.indexOf('/fcclibrary') !== -1) {
              var root = path.substring(0, path.indexOf('/fcclibrary') + '/fcclibrary'.length);
              url = root + '/backend/public' + url;
            }
          }
          return origFetch(url, options);
        };

        // Automatic fallback for asset paths under XAMPP subfolders
        document.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG') {
            var src = e.target.getAttribute('src');
            if (src && (src.startsWith('/assets/') || src.startsWith('/fcc-logo.png') || src.indexOf('fcc-logo.png') !== -1)) {
              var path = window.location.pathname;
              if (path.indexOf('/fcclibrary') !== -1) {
                var root = path.substring(0, path.indexOf('/fcclibrary') + '/fcclibrary'.length);
                var filename = src.split('/').pop();
                var candidate = root + '/dist/assets/' + filename;
                if (e.target.src !== candidate) {
                  e.target.src = candidate;
                }
              }
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="student-root"></div>
    <script type="module" src="/src/student/main-student.jsx"></script>
  </body>
</html>
